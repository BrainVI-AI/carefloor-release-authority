name: Authorize Carefloor Preflight

on:
  workflow_call:
    inputs:
      source_sha: { required: true, type: string }
      candidate_sha256: { required: true, type: string }
    outputs:
      receipt_base64: { value: "${{ jobs.authorize.outputs.receipt_base64 }}" }
      signature_base64: { value: "${{ jobs.authorize.outputs.signature_base64 }}" }

permissions:
  contents: read
  id-token: write

jobs:
  authorize:
    environment: carefloor-production-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      receipt_base64: ${{ steps.sign.outputs.receipt_base64 }}
      signature_base64: ${{ steps.sign.outputs.signature_base64 }}
    steps:
      - name: Verify source and sign pre-mutation authority
        id: sign
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          PRIVATE_KEY_PEM: ${{ secrets.CAREFLOOR_RELEASE_APPROVAL_PRIVATE_KEY_PEM }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = BrainVI-AI/brainvi-monorepo
          test "${#SOURCE_SHA}" = 40
          test "${#CANDIDATE_SHA256}" = 64
          AUTHOR="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA" --jq '.author.login // empty')"
          test -n "$AUTHOR"
          test "$AUTHOR" != "$GITHUB_ACTOR"
          node <<'JS'
          const { createPrivateKey, createPublicKey, sign } = require("node:crypto");
          const fs = require("node:fs");
          (async () => {
            const tokenResponse = await fetch(`${process.env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=carefloor-release-authority`, { headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } });
            if (!tokenResponse.ok) throw new Error(`OIDC identity unavailable: ${tokenResponse.status}`);
            const { value } = await tokenResponse.json();
            const claims = JSON.parse(Buffer.from(value.split(".")[1], "base64url"));
            if (!/^BrainVI-AI\/carefloor-release-authority\/.github\/workflows\/authorize-carefloor-preflight\.yml@/.test(claims.job_workflow_ref) || !/^[a-f0-9]{40}$/.test(claims.job_workflow_sha)) throw new Error("Untrusted authority workflow identity");
            const receipt = Buffer.from(JSON.stringify({
              schema: "brainvi.carefloor.release-preflight.v1",
              sourceSha: process.env.SOURCE_SHA,
              candidateSha256: process.env.CANDIDATE_SHA256,
              authorityWorkflowRef: claims.job_workflow_ref,
              authorityWorkflowSha: claims.job_workflow_sha,
              approvalEnvironment: "carefloor-production-approval",
              githubRunId: process.env.GITHUB_RUN_ID,
              githubRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
              authorizedAt: new Date().toISOString(),
            }));
            const privateKey = createPrivateKey(process.env.PRIVATE_KEY_PEM);
            const publicKey = createPublicKey(privateKey);
            const signature = sign(null, receipt, privateKey);
            if (!require("node:crypto").verify(null, receipt, publicKey, signature)) throw new Error("Preflight signature verification failed");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `receipt_base64=${receipt.toString("base64")}\nsignature_base64=${signature.toString("base64")}\n`);
          })().catch((error) => { console.error(error.message); process.exit(1); });
          JS
