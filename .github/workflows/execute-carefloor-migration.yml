name: Execute Carefloor Migration

on:
  workflow_call:
    inputs:
      source_sha: { required: true, type: string }
      candidate_sha256: { required: true, type: string }
      artifact_sha256: { required: true, type: string }
      migration_authorization_sha256: { required: true, type: string }
      deployment_url: { required: true, type: string }
      canonical_url: { required: true, type: string }
      authorization_receipt_base64: { required: true, type: string }
      authorization_signature_base64: { required: true, type: string }
      authorization_public_key_pem_base64: { required: true, type: string }

permissions:
  contents: read

jobs:
  migrate:
    environment: carefloor-production-migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CAREFLOOR_EXECUTOR_SOURCE_SHA: 053fe13b864a129baf3d76d9d76d4ee984b12440
      CAREFLOOR_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate authorized release identity
        run: node -e 'if(process.env.GITHUB_REPOSITORY!=="BrainVI-AI/brainvi-monorepo"||!process.env.GITHUB_WORKFLOW_REF.includes("/.github/workflows/carefloor-production-release.yml@")||!/^[a-f0-9]{40}$/.test(process.env.CAREFLOOR_RELEASE_SOURCE_SHA))throw new Error("invalid migration caller")'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: BrainVI-AI/brainvi-monorepo
          ref: ${{ env.CAREFLOOR_EXECUTOR_SOURCE_SHA }}
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 10.26.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify exact independent migration authorization
        env:
          RECEIPT: ${{ inputs.authorization_receipt_base64 }}
          SIGNATURE: ${{ inputs.authorization_signature_base64 }}
          PUBLIC_KEY: ${{ inputs.authorization_public_key_pem_base64 }}
          EXPECTED_KEY_SHA256: ${{ vars.CAREFLOOR_RELEASE_APPROVAL_PUBLIC_KEY_SHA256 }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          AUTHORIZATION_SHA256: ${{ inputs.migration_authorization_sha256 }}
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
        run: |
          node <<'JS'
          const {createHash,createPublicKey,verify}=require("node:crypto");
          const raw=Buffer.from(process.env.RECEIPT,"base64"), signature=Buffer.from(process.env.SIGNATURE,"base64"), key=createPublicKey(Buffer.from(process.env.PUBLIC_KEY,"base64"));
          if(createHash("sha256").update(key.export({type:"spki",format:"der"})).digest("hex")!==process.env.EXPECTED_KEY_SHA256||!verify(null,raw,key,signature))throw new Error("Migration authority trust failed");
          const receipt=JSON.parse(raw), expected={schema:"brainvi.carefloor.migration-authorization.v1",sourceSha:process.env.CAREFLOOR_RELEASE_SOURCE_SHA,candidateManifestSha256:process.env.CANDIDATE_SHA256,vercelArtifactSha256:process.env.ARTIFACT_SHA256,migrationAuthorizationSha256:process.env.AUTHORIZATION_SHA256,deploymentUrl:process.env.DEPLOYMENT_URL,callerRunId:process.env.GITHUB_RUN_ID,callerRunAttempt:process.env.GITHUB_RUN_ATTEMPT};
          for(const [field,value] of Object.entries(expected))if(String(receipt[field])!==String(value))throw new Error(`Migration authorization mismatch: ${field}`);
          if(Date.now()>Date.parse(receipt.expiresAt)||receipt.nonce!==`${receipt.callerRunId}:${receipt.callerRunAttempt}:${receipt.migrationAuthorizationSha256}`)throw new Error("Migration authorization expired or replayed");
          JS
      - name: Verify legal-hold contract compatibility floor
        if: ${{ hashFiles('apps/watchfloor/drizzle/0043_carefloor_legal_hold_generations_contract.sql') != '' }}
        env:
          CAREFLOOR_CANONICAL_URL: ${{ inputs.canonical_url }}
        run: |
          node --input-type=module <<'JS'
          const response=await fetch(`${process.env.CAREFLOOR_CANONICAL_URL}/api/version`,{cache:"no-store"});
          if(!response.ok)throw new Error("Canonical compatibility floor unavailable");
          const version=await response.json();
          if(version.compatibility?.legalHoldGenerations!=="expand-contract-v1")throw new Error("Canonical Carefloor is not compatible with the legal-hold contract migration");
          JS
      - name: Apply pinned production migrations
        working-directory: apps/watchfloor
        env:
          NODE_ENV: production
          CAREFLOOR_TENANT_ID: ${{ secrets.CAREFLOOR_TENANT_ID }}
          CAREFLOOR_DATABASE_URL: ${{ secrets.CAREFLOOR_DATABASE_URL }}
          CAREFLOOR_DATABASE_URL_UNPOOLED: ${{ secrets.CAREFLOOR_DATABASE_URL_UNPOOLED }}
          CAREFLOOR_LEDGER_RETENTION_POLICY_JSON: ${{ secrets.CAREFLOOR_LEDGER_RETENTION_POLICY_JSON }}
          CAREFLOOR_LEDGER_RETENTION_POLICY_SHA256: ${{ secrets.CAREFLOOR_LEDGER_RETENTION_POLICY_SHA256 }}
          CAREFLOOR_LEDGER_RETENTION_POLICY_SIGNATURE: ${{ secrets.CAREFLOOR_LEDGER_RETENTION_POLICY_SIGNATURE }}
          CAREFLOOR_LEDGER_RETENTION_POLICY_PUBLIC_KEY_PEM: ${{ secrets.CAREFLOOR_LEDGER_RETENTION_POLICY_PUBLIC_KEY_PEM }}
          CAREFLOOR_LEDGER_RETENTION_CAPABILITY_KEY: ${{ secrets.CAREFLOOR_LEDGER_RETENTION_CAPABILITY_KEY }}
        run: |
          mkdir -p ../../artifacts/carefloor-production-release
          node --import tsx scripts/carefloor-migrate.mjs > ../../artifacts/carefloor-production-release/migration.json
          node --import tsx scripts/install-carefloor-ledger-retention-policy.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: carefloor-migration-${{ inputs.source_sha }}
          path: artifacts/carefloor-production-release/migration.json
          if-no-files-found: error
          retention-days: 90
