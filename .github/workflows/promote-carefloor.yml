name: Promote Carefloor

on:
  workflow_call:
    inputs:
      source_sha: { required: true, type: string }
      candidate_sha256: { required: true, type: string }
      artifact_sha256: { required: true, type: string }
      envelope_sha256: { required: true, type: string }
      deployment_url: { required: true, type: string }
      canonical_url: { required: true, type: string }
      approval_receipt_base64: { required: true, type: string }
      approval_signature_base64: { required: true, type: string }

permissions:
  actions: read
  attestations: read
  contents: read
  id-token: write

jobs:
  promote:
    environment: carefloor-production-promotion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
      ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
      ENVELOPE_SHA256: ${{ inputs.envelope_sha256 }}
      DEPLOYMENT_URL: ${{ inputs.deployment_url }}
      CANONICAL_URL: ${{ inputs.canonical_url }}
      APPROVAL_RECEIPT_BASE64: ${{ inputs.approval_receipt_base64 }}
      APPROVAL_SIGNATURE_BASE64: ${{ inputs.approval_signature_base64 }}
      APPROVAL_PUBLIC_KEY_PEM: ${{ secrets.CAREFLOOR_RELEASE_APPROVAL_PUBLIC_KEY_PEM }}
      EXPECTED_PUBLIC_KEY_SHA256: ${{ vars.CAREFLOOR_RELEASE_APPROVAL_PUBLIC_KEY_SHA256 }}
      VERCEL_ORG_ID: ${{ vars.CAREFLOOR_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.CAREFLOOR_VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.CAREFLOOR_VERCEL_PROMOTION_TOKEN }}
      EVIDENCE_DIR: authority/evidence
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve immutable authority workflow identity
        id: authority
        env:
          TOKEN_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          TOKEN_REQUEST: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          node <<'JS'
          const fs = require("node:fs");
          (async () => {
            const response = await fetch(`${process.env.TOKEN_URL}&audience=carefloor-release-authority`, { headers: { Authorization: `Bearer ${process.env.TOKEN_REQUEST}` } });
            if (!response.ok) throw new Error(`OIDC identity unavailable: ${response.status}`);
            const { value } = await response.json();
            const claims = JSON.parse(Buffer.from(value.split(".")[1], "base64url"));
            if (!/^BrainVI-AI\/carefloor-release-authority\/.github\/workflows\/promote-carefloor\.yml@/.test(claims.job_workflow_ref) || !/^[a-f0-9]{40}$/.test(claims.job_workflow_sha)) throw new Error("Untrusted authority workflow identity");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `ref=${claims.job_workflow_ref}\nsha=${claims.job_workflow_sha}\n`);
          })().catch((error) => { console.error(error.message); process.exit(1); });
          JS
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: BrainVI-AI/carefloor-release-authority
          ref: ${{ steps.authority.outputs.sha }}
          path: authority-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: carefloor-validated-${{ inputs.source_sha }}
          path: authority/evidence
      - name: Verify trusted caller provenance
        run: |
          test "$GITHUB_REPOSITORY" = BrainVI-AI/brainvi-monorepo
          gh attestation verify authority/evidence/candidate.json \
            --repo BrainVI-AI/brainvi-monorepo \
            --source-digest "$SOURCE_SHA" \
            --source-ref refs/heads/main \
            --signer-workflow BrainVI-AI/brainvi-monorepo/.github/workflows/carefloor-production-release.yml \
            --deny-self-hosted-runners \
            --predicate-type https://slsa.dev/provenance/v1
      - name: Validate approval and promote exact artifact
        env:
          AUTHORITY_WORKFLOW_REF: ${{ steps.authority.outputs.ref }}
          AUTHORITY_WORKFLOW_SHA: ${{ steps.authority.outputs.sha }}
        run: node authority-source/scripts/release-authority.mjs promote
      - name: Persist promotion receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: carefloor-external-promotion-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: authority/promotion-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Roll back canonical deployment after any post-promotion failure
        if: failure()
        env:
          AUTHORITY_WORKFLOW_REF: ${{ steps.authority.outputs.ref }}
          AUTHORITY_WORKFLOW_SHA: ${{ steps.authority.outputs.sha }}
        run: node authority-source/scripts/release-authority.mjs rollback
      - name: Persist rollback receipt
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: carefloor-external-rollback-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: authority/rollback-receipt.json
          if-no-files-found: ignore
          retention-days: 90
