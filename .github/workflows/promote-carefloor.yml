name: Promote Carefloor

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      candidate_sha256:
        required: true
        type: string
      artifact_sha256:
        required: true
        type: string
      envelope_sha256:
        required: true
        type: string
      deployment_url:
        required: true
        type: string
      canonical_url:
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  promote:
    environment: carefloor-production-approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
      ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
      ENVELOPE_SHA256: ${{ inputs.envelope_sha256 }}
      DEPLOYMENT_URL: ${{ inputs.deployment_url }}
      CANONICAL_URL: ${{ inputs.canonical_url }}
      VERCEL_ORG_ID: ${{ vars.CAREFLOOR_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.CAREFLOOR_VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.CAREFLOOR_VERCEL_PROMOTION_TOKEN }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: carefloor-validated-${{ inputs.source_sha }}
          path: authority/evidence
      - name: Validate immutable envelope and promote
        run: |
          node <<'JS'
          const fs = require("node:fs");
          const { createHash } = require("node:crypto");
          const root = "authority/evidence/";
          const hex = (value, length) => new RegExp(`^[a-f0-9]{${length}}$`).test(value ?? "");
          const sha = (name) => createHash("sha256").update(fs.readFileSync(root + name)).digest("hex");
          if (!hex(process.env.SOURCE_SHA, 40) || !["CANDIDATE_SHA256", "ARTIFACT_SHA256", "ENVELOPE_SHA256"].every((key) => hex(process.env[key], 64))) throw new Error("Invalid release identity");
          if (!/^team_[A-Za-z0-9]+$/.test(process.env.VERCEL_ORG_ID ?? "") || !/^prj_[A-Za-z0-9]+$/.test(process.env.VERCEL_PROJECT_ID ?? "") || !(process.env.VERCEL_TOKEN ?? "").trim()) throw new Error("Promotion authority is not configured");
          const deploymentUrl = new URL(process.env.DEPLOYMENT_URL);
          const canonicalUrl = new URL(process.env.CANONICAL_URL);
          if (deploymentUrl.protocol !== "https:" || !deploymentUrl.hostname.endsWith(".vercel.app") || canonicalUrl.href !== "https://brainvi-carefloor.vercel.app/") throw new Error("Invalid Carefloor deployment binding");
          if (sha("candidate.json") !== process.env.ENVELOPE_SHA256) throw new Error("Release envelope hash mismatch");
          const candidate = JSON.parse(fs.readFileSync(root + "candidate.json", "utf8"));
          const artifact = JSON.parse(fs.readFileSync(root + "vercel-artifact.json", "utf8"));
          if (candidate.sourceSha !== process.env.SOURCE_SHA || candidate.browserCandidateManifestSha256 !== process.env.CANDIDATE_SHA256 || candidate.vercelArtifactSha256 !== process.env.ARTIFACT_SHA256 || artifact.sourceSha !== process.env.SOURCE_SHA || artifact.sha256 !== process.env.ARTIFACT_SHA256) throw new Error("Release envelope identity mismatch");
          for (const [field, file] of [["controlPlaneReceiptSha256", "control-plane.json"], ["migrationReceiptSha256", "migration.json"], ["transactionReceiptSha256", "transaction.json"], ["jacksonCostReceiptSha256", "jackson-cost-receipt.json"]]) if (candidate[field] !== sha(file)) throw new Error(`Release receipt mismatch: ${field}`);
          const request = async (url, init = {}) => {
            const signal = AbortSignal.timeout(15_000);
            const response = await fetch(url, { ...init, signal, headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}`, ...(init.headers ?? {}) } });
            const text = await response.text();
            if (!response.ok) throw new Error(`Vercel authority request failed: ${response.status}`);
            return text ? JSON.parse(text) : {};
          };
          (async () => {
            const deployment = await request(`https://api.vercel.com/v13/deployments/${encodeURIComponent(deploymentUrl.hostname)}?teamId=${encodeURIComponent(process.env.VERCEL_ORG_ID)}`);
            const projectId = deployment.projectId ?? deployment.project?.id;
            if (projectId !== process.env.VERCEL_PROJECT_ID || deployment.ownerId !== process.env.VERCEL_ORG_ID || deployment.target !== "production" || deployment.readyState !== "READY" || deployment.meta?.carefloorSourceSha !== process.env.SOURCE_SHA || deployment.meta?.carefloorArtifactSha256 !== process.env.ARTIFACT_SHA256) throw new Error("Staged Vercel deployment is not the admitted artifact");
            const staged = await fetch(`${deploymentUrl.origin}/api/version`, { cache: "no-store", signal: AbortSignal.timeout(15_000) });
            if (!staged.ok) throw new Error("Staged Carefloor version is unavailable");
            const version = await staged.json();
            if (version.gitHead !== process.env.SOURCE_SHA || version.candidateManifestSha256 !== process.env.CANDIDATE_SHA256) throw new Error("Staged Carefloor source binding mismatch");
            await request(`https://api.vercel.com/v10/projects/${encodeURIComponent(projectId)}/promote/${encodeURIComponent(deployment.id)}?teamId=${encodeURIComponent(process.env.VERCEL_ORG_ID)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
            for (let attempt = 0; attempt < 60; attempt += 1) {
              const response = await fetch(`${canonicalUrl.origin}/api/version`, { cache: "no-store", signal: AbortSignal.timeout(15_000) }).catch(() => null);
              if (response?.ok) {
                const current = await response.json();
                if (current.gitHead === process.env.SOURCE_SHA && current.candidateManifestSha256 === process.env.CANDIDATE_SHA256) {
                  const receipt = { schema: "brainvi.carefloor.external-promotion.v1", sourceSha: process.env.SOURCE_SHA, candidateManifestSha256: process.env.CANDIDATE_SHA256, vercelArtifactSha256: process.env.ARTIFACT_SHA256, releaseEnvelopeSha256: process.env.ENVELOPE_SHA256, deploymentId: deployment.id, authorityRepository: process.env.GITHUB_REPOSITORY, authorityWorkflowSha: process.env.GITHUB_WORKFLOW_SHA, promotedAt: new Date().toISOString() };
                  fs.writeFileSync("authority/promotion-receipt.json", JSON.stringify(receipt, null, 2) + "\n");
                  return;
                }
              }
              await new Promise((resolve) => setTimeout(resolve, 5_000));
            }
            throw new Error("Canonical Carefloor promotion did not converge");
          })().catch((error) => { console.error(error.message); process.exit(1); });
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: carefloor-external-promotion-${{ inputs.source_sha }}
          path: authority/promotion-receipt.json
          if-no-files-found: error
          retention-days: 90
